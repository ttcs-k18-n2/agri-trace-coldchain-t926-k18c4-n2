<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRI TRACEABILITY - Chi tiết lô thu hoạch & Phả hệ</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    .detail-container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 20px 80px 20px;
    }

    .top-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--color-text-muted);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      background: var(--liquid-glass-bg);
      border: var(--liquid-glass-border);
      backdrop-filter: var(--liquid-glass-blur);
      -webkit-backdrop-filter: var(--liquid-glass-blur);
      transition: var(--transition-fast);
    }

    .btn-back:hover {
      color: var(--color-text-main);
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(0, 0, 0, 0.15);
      transform: translateX(-2px);
    }

    .role-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Hero Lot Overview Card */
    .hero-card {
      background: var(--liquid-glass-bg);
      border: var(--liquid-glass-border);
      border-radius: var(--radius-xl);
      padding: 28px;
      margin-bottom: 24px;
      backdrop-filter: var(--liquid-glass-blur);
      -webkit-backdrop-filter: var(--liquid-glass-blur);
      box-shadow: var(--liquid-glass-shadow);
      position: relative;
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    .lot-id-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lot-code-hero {
      font-family: var(--font-mono, monospace);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--color-primary);
      background: rgba(36, 138, 61, 0.08);
      padding: 6px 14px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(36, 138, 61, 0.22);
    }

    .btn-copy-code {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-text-muted);
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .btn-copy-code:hover {
      color: var(--color-text-main);
      border-color: var(--color-text-muted);
    }

    .hero-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--color-text-main);
      margin: 0 0 16px 0;
    }

    .hero-stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      padding-top: 20px;
      border-top: 1px solid var(--color-border);
    }

    .hero-stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hero-stat-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-light);
    }

    .hero-stat-val {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-main);
    }

    /* Details Grid */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .details-grid {
        grid-template-columns: 1fr;
      }
    }

    .info-card {
      background: var(--liquid-glass-bg);
      border: var(--liquid-glass-border);
      border-radius: var(--radius-xl);
      padding: 24px;
      backdrop-filter: var(--liquid-glass-blur);
      -webkit-backdrop-filter: var(--liquid-glass-blur);
      box-shadow: var(--liquid-glass-shadow);
    }

    .card-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-main);
      margin: 0 0 18px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      font-size: 13.5px;
    }

    .meta-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .meta-key {
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .meta-val {
      color: var(--color-text-main);
      font-weight: 600;
      text-align: right;
    }

    /* Direct Lineage Card Styles */
    .lineage-card {
      background: var(--liquid-glass-bg);
      border: var(--liquid-glass-border);
      border-radius: var(--radius-xl);
      padding: 28px;
      margin-bottom: 24px;
      backdrop-filter: var(--liquid-glass-blur);
      -webkit-backdrop-filter: var(--liquid-glass-blur);
      box-shadow: var(--liquid-glass-shadow);
    }

    .lineage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      padding-bottom: 14px;
    }

    .lineage-block-title {
      font-size: 13.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(36, 138, 61, 0.12);
      color: var(--color-primary);
      font-size: 11px;
      font-weight: 700;
      border-radius: var(--radius-full);
      padding: 2px 8px;
    }

    .parent-lot-box {
      background: #ffffff;
      border: 1.5px solid rgba(36, 138, 61, 0.25);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-fast);
    }

    .parent-lot-box:hover {
      border-color: var(--color-primary);
      box-shadow: var(--shadow-hover);
    }

    .parent-lot-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .parent-lot-code-tag {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .parent-lot-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--color-text-main);
    }

    .parent-lot-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--color-text-muted);
      flex-wrap: wrap;
    }

    .btn-goto-lineage {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-primary);
      background: rgba(36, 138, 61, 0.08);
      border: 1px solid rgba(36, 138, 61, 0.2);
      border-radius: var(--radius-md);
      text-decoration: none;
      transition: var(--transition-fast);
    }

    .btn-goto-lineage:hover {
      background: var(--color-primary);
      color: #ffffff;
      border-color: var(--color-primary);
      transform: translateX(2px);
    }

    .lineage-empty-box {
      background: rgba(0, 0, 0, 0.02);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .lineage-empty-icon {
      font-size: 24px;
      line-height: 1;
    }

    .child-lots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .child-lot-card {
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-fast);
    }

    .child-lot-card:hover {
      border-color: rgba(36, 138, 61, 0.4);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .child-lot-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .child-lot-code {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--color-primary);
    }

    .child-lot-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text-main);
    }

    .child-lot-meta {
      font-size: 12.5px;
      color: var(--color-text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .child-lot-footer {
      padding-top: 10px;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
    }

    .child-lot-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-primary);
      text-decoration: none;
      transition: var(--transition-fast);
    }

    .child-lot-link:hover {
      color: var(--color-primary-hover);
      transform: translateX(2px);
    }

    /* Ledger Events Timeline */
    .ledger-card {
      background: var(--liquid-glass-bg);
      border: var(--liquid-glass-border);
      border-radius: var(--radius-xl);
      padding: 28px;
      margin-bottom: 24px;
      backdrop-filter: var(--liquid-glass-blur);
      -webkit-backdrop-filter: var(--liquid-glass-blur);
      box-shadow: var(--liquid-glass-shadow);
    }

    .ledger-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .timeline-list {
      position: relative;
      padding-left: 28px;
    }

    .timeline-list::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background: rgba(36, 138, 61, 0.25);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 24px;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    .timeline-node {
      position: absolute;
      left: -28px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(36, 138, 61, 0.15);
    }

    .timeline-content {
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }

    .timeline-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .event-type-badge {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      background: rgba(36, 138, 61, 0.1);
      color: var(--color-primary);
      border: 1px solid rgba(36, 138, 61, 0.2);
    }

    .event-time {
      font-size: 12.5px;
      color: var(--color-text-muted);
    }

    .hash-row {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--color-border);
      font-family: var(--font-mono, monospace);
      font-size: 11.5px;
      color: var(--color-text-light);
      word-break: break-all;
    }

    .hash-val {
      color: var(--color-text-muted);
      font-weight: 600;
    }
  </style>
</head>

  <script src="/app-shell.js"></script>
  <script>
    let currentUser = null;
    let lotData = null;
    let lotEvents = [];

    async function initPage() {
      currentUser = await initAppShell({ activeNav: "lots" });
      if (!currentUser) return;

      const urlParams = new URLSearchParams(window.location.search);
      const lotId = urlParams.get("id") || urlParams.get("lotId");

      if (!lotId) {
        renderError("Thiếu mã định danh lô hàng", "Vui lòng chọn một lô hàng từ danh sách để xem chi tiết.");
        return;
      }

      await loadLotDetail(lotId);
    }

    async function loadLotDetail(lotId) {
      try {
        const [lotRes, eventsRes] = await Promise.all([
          fetch(`/api/lots/${encodeURIComponent(lotId)}`, { credentials: "same-origin" }),
          fetch(`/api/lots/${encodeURIComponent(lotId)}/events`, { credentials: "same-origin" })
        ]);

        if (lotRes.status === 403) {
          renderError("Truy cập bị từ chối (403)", "Bạn không có quyền truy cập lô hàng thuộc tổ chức khác theo chính sách bảo mật Multi-tenant.");
          return;
        }

        if (lotRes.status === 404) {
          renderError("Không tìm thấy lô hàng (404)", `Mã lô hàng "${lotId}" không tồn tại trong hệ thống.`);
          return;
        }

        if (!lotRes.ok) {
          renderError("Lỗi kết nối", "Không thể tải thông tin lô hàng từ máy chủ.");
          return;
        }

        const lotJson = await lotRes.json();
        lotData = lotJson.lot || lotJson;

        if (eventsRes.ok) {
          const eventsJson = await eventsRes.json();
          lotEvents = eventsJson.events || [];
        }

        renderLot(lotData, lotEvents);
      } catch (err) {
        renderError("Lỗi hệ thống", err.message || "Không thể đồng bộ dữ liệu.");
      }
    }

    function renderLot(lot, events) {
      const isInspectorOrAdmin = currentUser && ["inspector", "admin"].includes(currentUser.roleId);
      const role = currentUser ? currentUser.roleId : "";

      // Render top action bar based on user role
      const roleActionsEl = document.getElementById("roleActions");
      if (roleActionsEl) {
        let actionButtonsHtml = "";

        if (isInspectorOrAdmin) {
          actionButtonsHtml += `
            <a id="btnCheckIntegrityLink" href="/integrity.html?lotId=${encodeURIComponent(lot.id)}" class="btn btn-secondary" style="border: 1px solid var(--color-primary); color: var(--color-primary); font-weight: 600; gap: 8px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
              <span>Kiểm tra toàn vẹn chuỗi sự kiện</span>
            </a>
          `;
        }

        if (["cooperative", "org_admin", "admin"].includes(role)) {
          actionButtonsHtml += `
            <a href="/harvest.html" class="btn btn-primary" style="gap: 8px; font-weight: 600;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              <span>Sơ chế / Tạo lô mới</span>
            </a>
            <a href="/farms.html" class="btn btn-secondary" style="gap: 8px; font-weight: 600;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span>Xem thửa đất gốc</span>
            </a>
          `;
        } else if (role === "producer") {
          actionButtonsHtml += `
            <a href="/harvest.html" class="btn btn-primary" style="gap: 8px; font-weight: 600;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              <span>Ghi nhận thu hoạch mới</span>
            </a>
            <a href="/farms.html" class="btn btn-secondary" style="gap: 8px; font-weight: 600;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span>Xem thửa đất</span>
            </a>
          `;
        }

        roleActionsEl.innerHTML = actionButtonsHtml;
        roleActionsEl.style.display = actionButtonsHtml ? "flex" : "none";
      }

      const unit = lot.productUnit || "kg";
      const initialQtyFormatted = (lot.initialQuantity !== null && lot.initialQuantity !== undefined)
        ? `${Number(lot.initialQuantity).toFixed(3)} ${unit}`
        : "--";
      const remainingQtyFormatted = (lot.remainingQuantity !== null && lot.remainingQuantity !== undefined)
        ? `${Number(lot.remainingQuantity).toFixed(3)} ${unit}`
        : "--";
      const harvestDateFormatted = formatDate(lot.harvestedAt || lot.createdAt);
      const displayName = lot.productName || lot.name || "Nông sản";
      const farmDisplay = lot.farmName || lot.farmId || "Thửa chưa gán";
      const orgDisplay = lot.organizationName || lot.organizationId || "--";

      const contentArea = document.getElementById("contentArea");

      contentArea.innerHTML = `
        <!-- Hero Overview -->
        <div class="hero-card">
          <div class="hero-top">
            <div class="lot-id-group">
              <span class="lot-code-hero">${escapeHtml(lot.id)}</span>
              <button class="btn-copy-code" onclick="copyLotCode('${escapeHtml(lot.id)}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span id="copyText">Sao chép</span>
              </button>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="status-pill success">
                <span class="status-dot"></span>
                <span>${escapeHtml(lot.status || "Đã thu hoạch")}</span>
              </span>
              <div class="dropdown-menu-wrapper">
                <button type="button" class="btn-icon-kebab" id="btn-hero-more" onclick="toggleHeroDropdown(event)" title="Thao tác khác" aria-label="Thao tác khác">•••</button>
                <div class="dropdown-popover" id="dropdown-hero-lot">
                  ${isInspectorOrAdmin ? `
                    <a href="/integrity.html?lotId=${encodeURIComponent(lot.id)}" class="dropdown-item">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                      <span>Kiểm tra toàn vẹn</span>
                    </a>
                  ` : ""}
                  <button type="button" class="dropdown-item" onclick="copyLotCode('${escapeHtml(lot.id)}')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span>Sao chép mã định danh</span>
                  </button>
                  ${lot.productId ? `
                    <a href="/lots.html?productId=${encodeURIComponent(lot.productId)}" class="dropdown-item">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m10 15 5-3-5-3v6Z"/></svg>
                      <span>Xem lô cùng sản phẩm</span>
                    </a>
                  ` : ""}
                  <a href="/farms.html" class="dropdown-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    <span>Xem thửa đất</span>
                  </a>
                  <div class="dropdown-divider"></div>
                  <a href="/lots.html" class="dropdown-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    <span>Về danh sách lô</span>
                  </a>
                </div>
              </div>
            </div>
          </div>

          <h1 class="hero-title">${escapeHtml(displayName)}</h1>

          <div class="hero-stats-row">
            <div class="hero-stat-item">
              <span class="hero-stat-label">Khối lượng ban đầu</span>
              <span class="hero-stat-val">${initialQtyFormatted}</span>
            </div>
            <div class="hero-stat-item">
              <span class="hero-stat-label">Khối lượng còn lại</span>
              <span class="hero-stat-val" style="color: var(--color-primary);">${remainingQtyFormatted}</span>
            </div>
            <div class="hero-stat-item">
              <span class="hero-stat-label">Ngày thu hoạch</span>
              <span class="hero-stat-val">${harvestDateFormatted}</span>
            </div>
            <div class="hero-stat-item">
              <span class="hero-stat-label">Thửa đất sản xuất</span>
              <span class="hero-stat-val">${escapeHtml(farmDisplay)}</span>
            </div>
            <div class="hero-stat-item">
              <span class="hero-stat-label">Tổ chức nắm giữ</span>
              <span class="hero-stat-val" style="font-size: 15px;">${escapeHtml(orgDisplay)}</span>
            </div>
          </div>
        </div>

        <!-- Direct Lineage: Parent & Child Lots (Phả hệ trực tiếp) -->
        <div class="lineage-card">
          <div class="lineage-header">
            <h3 class="card-heading" style="margin-bottom: 0;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="6" y1="3" x2="6" y2="15"/>
                <circle cx="18" cy="6" r="3"/>
                <circle cx="6" cy="18" r="3"/>
                <path d="M18 9a9 9 0 0 1-9 9"/>
              </svg>
              <span>Phả hệ trực tiếp (Lô mẹ & Lô con)</span>
            </h3>
            <span class="badge-role" style="background: rgba(36, 138, 61, 0.08); color: var(--color-primary); font-weight: 600; padding: 4px 10px; border-radius: var(--radius-sm);">Lô mẹ - Lô con trực tiếp</span>
          </div>

          <!-- Parent Lot Box -->
          <div class="lineage-block-title">Lô mẹ trực tiếp (Nguồn gốc trực tiếp)</div>
          ${lot.parentLot ? `
            <div class="parent-lot-box">
              <div class="parent-lot-info">
                <div class="parent-lot-code-tag">
                  <span class="font-mono" style="font-weight: 800; color: var(--color-primary); font-size: 14px;">${escapeHtml(lot.parentLot.id)}</span>
                  <span class="status-pill ${lot.parentLot.status === 'Đã thu hoạch' || lot.parentLot.status === 'Đã nhập kho' ? 'success' : 'warning'}" style="font-size: 11px; padding: 2px 8px;">
                    ${escapeHtml(lot.parentLot.status || "Đã thu hoạch")}
                  </span>
                </div>
                <div class="parent-lot-name">${escapeHtml(lot.parentLot.productName || lot.parentLot.name || "Lô mẹ")}</div>
                <div class="parent-lot-meta">
                  <span><strong>Tổ chức:</strong> ${escapeHtml(lot.parentLot.organizationName || lot.parentLot.organizationId || "--")}</span>
                  ${lot.parentLot.remainingQuantity !== null && lot.parentLot.remainingQuantity !== undefined ? `
                    <span>&bull;</span>
                    <span><strong>Khối lượng còn lại:</strong> ${Number(lot.parentLot.remainingQuantity).toFixed(3)} ${escapeHtml(lot.parentLot.productUnit || "kg")}</span>
                  ` : ""}
                </div>
              </div>
              <a href="/lot-detail.html?id=${encodeURIComponent(lot.parentLot.id)}" class="btn-goto-lineage">
                <span>Xem lô mẹ</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </a>
            </div>
          ` : `
            <div class="lineage-empty-box">
              <div class="lineage-empty-icon">🌱</div>
              <div>
                <div style="font-weight: 600; color: var(--color-text-main);">Lô gốc F0 (Lô thu hoạch ban đầu)</div>
                <div style="font-size: 12.5px; color: var(--color-text-muted);">Lô hàng này được thu hoạch trực tiếp từ thửa đất sản xuất, không tách hoặc sơ chế từ lô mẹ nào.</div>
              </div>
            </div>
          `}

          <!-- Child Lots Section -->
          <div class="lineage-block-title" style="margin-top: 22px;">
            <span>Các lô con trực tiếp</span>
            <span class="count-badge">${(lot.childLots || []).length}</span>
          </div>

          ${(lot.childLots && lot.childLots.length > 0) ? `
            <div class="child-lots-grid">
              ${lot.childLots.map(child => `
                <div class="child-lot-card">
                  <div>
                    <div class="child-lot-top">
                      <span class="font-mono child-lot-code">${escapeHtml(child.id)}</span>
                      <span class="status-pill success" style="font-size: 11px; padding: 2px 8px;">${escapeHtml(child.status || "Đã tạo")}</span>
                    </div>
                    <div class="child-lot-title" style="margin-top: 8px;">${escapeHtml(child.productName || child.name || "Lô con")}</div>
                    <div class="child-lot-meta" style="margin-top: 6px;">
                      <div><strong>Tổ chức:</strong> ${escapeHtml(child.organizationName || child.organizationId || "--")}</div>
                      ${child.remainingQuantity !== null && child.remainingQuantity !== undefined ? `
                        <div><strong>Khối lượng:</strong> ${Number(child.remainingQuantity).toFixed(3)} ${escapeHtml(child.productUnit || "kg")}</div>
                      ` : ""}
                    </div>
                  </div>
                  <div class="child-lot-footer">
                    <a href="/lot-detail.html?id=${encodeURIComponent(child.id)}" class="child-lot-link">
                      <span>Xem chi tiết lô con</span>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </a>
                  </div>
                </div>
              `).join("")}
            </div>
          ` : `
            <div class="lineage-empty-box">
              <div class="lineage-empty-icon">📦</div>
              <div>
                <div style="font-weight: 600; color: var(--color-text-main);">Chưa có lô con trực tiếp</div>
                <div style="font-size: 12.5px; color: var(--color-text-muted);">Chưa có lô hàng mới nào được phân tách, sơ chế hoặc đóng gói từ lô này.</div>
              </div>
            </div>
          `}
        </div>

        <!-- Specifications Grid -->
        <div class="details-grid">
          <div class="info-card">
            <h3 class="card-heading">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              <span>Thông tin nông sản & sản xuất</span>
            </h3>
            <div class="meta-row">
              <span class="meta-key">Tên sản phẩm</span>
              <span class="meta-val">${escapeHtml(displayName)}</span>
            </div>
            <div class="meta-row">
              <span class="meta-key">Mã sản phẩm</span>
              <span class="meta-val font-mono">${escapeHtml(lot.productId || "--")}</span>
            </div>
            <div class="meta-row">
              <span class="meta-key">Đơn vị đo lường</span>
              <span class="meta-val">${escapeHtml(unit)}</span>
            </div>
            <div class="meta-row">
              <span class="meta-key">Tổ chức nắm giữ</span>
              <span class="meta-val">${escapeHtml(orgDisplay)}</span>
            </div>
            <div class="meta-row">
              <span class="meta-key">Trạng thái</span>
              <span class="meta-val">${escapeHtml(lot.status || "Đã thu hoạch")}</span>
            </div>
          </div>

          <div class="info-card">
            <h3 class="card-heading">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
              <span>Thông tin thửa đất & nguồn gốc</span>
            </h3>
            <div class="meta-row">
              <span class="meta-key">Tên thửa</span>
              <span class="meta-val">${escapeHtml(farmDisplay)}</span>
            </div>
            <div class="meta-row">
              <span class="meta-key">Mã thửa đất</span>
              <span class="meta-val font-mono">${escapeHtml(lot.farmId || "--")}</span>
            </div>
            <div class="meta-row">
              <span class="meta-key">Ngày ghi nhận lô</span>
              <span class="meta-val">${formatDateTime(lot.createdAt || lot.harvestedAt)}</span>
            </div>
            <div class="meta-row">
              <span class="meta-key">Toàn vẹn sự kiện</span>
              <span class="meta-val" style="color: var(--color-primary); font-weight: 700;">Append-only Ledger</span>
            </div>
          </div>
        </div>

        <!-- Ledger Events Timeline -->
        <div class="ledger-card">
          <div class="ledger-header">
            <div>
              <h3 class="card-heading" style="margin-bottom: 4px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span>Sổ cái sự kiện bất biến (${events.length} sự kiện)</span>
              </h3>
              <p style="font-size: 13px; color: var(--color-text-muted); margin: 0;">Mỗi sự kiện được băm chuỗi bảo vệ cryptographic SHA-256 chống sửa đổi hoặc xóa lén.</p>
            </div>

            ${isInspectorOrAdmin ? `
              <a href="/integrity.html?lotId=${encodeURIComponent(lot.id)}" class="btn-lot-action" style="background: rgba(36, 138, 61, 0.08); color: var(--color-primary); border-color: rgba(36, 138, 61, 0.25);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Kiểm tra toàn vẹn</span> &rarr;
              </a>
            ` : ""}
          </div>

          ${events.length === 0 ? `
            <div style="text-align: center; padding: 32px; color: var(--color-text-muted);">
              Chưa có sự kiện nào được ghi nhận cho lô hàng này.
            </div>
          ` : `
            <div class="timeline-list">
              ${events.map((evt, idx) => `
                <div class="timeline-item">
                  <div class="timeline-node">${evt.sequenceNo || (idx + 1)}</div>
                  <div class="timeline-content">
                    <div class="timeline-top">
                      <span class="event-type-badge">${escapeHtml(evt.eventType || "EVENT")}</span>
                      <span class="event-time">${formatDateTime(evt.occurredAt || evt.createdAt)}</span>
                    </div>
                    <div style="font-size: 13px; color: var(--color-text-main); margin-bottom: 6px;">
                      <strong>Tổ chức:</strong> ${escapeHtml(evt.organizationId || "--")} | <strong>Người ghi:</strong> ${escapeHtml(evt.actorUserId || "--")}
                    </div>
                    <div class="hash-row">
                      <div><span style="font-weight: 700;">Event Hash:</span> <span class="hash-val">${escapeHtml(evt.eventHash || "--")}</span></div>
                      <div style="margin-top: 4px;"><span style="font-weight: 700;">Prev Hash:</span> <span class="hash-val">${escapeHtml(evt.previousHash || "--")}</span></div>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          `}
        </div>
      `;
    }

    function renderError(title, desc) {
      const contentArea = document.getElementById("contentArea");
      contentArea.innerHTML = `
        <div class="empty-state" style="padding: 60px 20px;">
          <div class="empty-state-icon" style="background: rgba(220, 38, 38, 0.1); color: #dc2626;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <div class="empty-state-title" style="color: #dc2626;">${escapeHtml(title)}</div>
          <div class="empty-state-desc">${escapeHtml(desc)}</div>
          <a href="/lots.html" class="btn btn-secondary" style="margin-top: 16px;">&larr; Về danh sách lô hàng</a>
        </div>
      `;
    }

    function copyLotCode(code) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => {
          const btn = document.getElementById("copyText");
          if (btn) {
            btn.textContent = "✓ Đã chép";
            setTimeout(() => { btn.textContent = "Sao chép"; }, 2000);
          }
        });
      }
    }

    function formatDate(dateVal) {
      if (!dateVal) return "N/A";
      if (typeof dateVal === "string" && dateVal.includes("T")) {
        dateVal = dateVal.split("T")[0];
      }
      const parts = String(dateVal).split("-");
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return String(dateVal);
    }

    function formatDateTime(dt) {
      if (!dt) return "N/A";
      try {
        const d = new Date(dt);
        if (isNaN(d.getTime())) return String(dt);
        return d.toLocaleString("vi-VN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      } catch {
        return String(dt);
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toggleHeroDropdown(e) {
      if (e) e.stopPropagation();
      const popover = document.getElementById("dropdown-hero-lot");
      if (popover) {
        popover.classList.toggle("active");
      }
    }

    initPage();
  </script>
</body>
</html>
