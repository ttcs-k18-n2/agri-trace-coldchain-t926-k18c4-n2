<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiến Độ Thu Hồi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .progress-bg {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 30px;
            background-color: #28a745;
            text-align: center;
            line-height: 30px;
            color: white;
            font-weight: bold;
            transition: width 0.5s ease-in-out;
        }

        .btn {
            padding: 10px 15px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #138496;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Tiến Độ Đợt Thu Hồi (S-37)</h2>
        <p><strong>Mã Đợt Thu Hồi:</strong> <span id="display_id">---</span></p>
        <p><strong>Số cơ sở đã xác nhận:</strong> <span id="ack_count">0</span> / <span id="total_expected">0</span></p>

        <!-- Thanh tiến trình -->
        <div class="progress-bg">
            <div class="progress-bar" id="my_progress_bar">0%</div>
        </div>

        <button class="btn" onclick="fetchMockData()">Tải Dữ Liệu Chạy Thử</button>
    </div>

    <script>
        // Hàm mô phỏng việc gọi API lấy dữ liệu tiến độ
        function fetchMockData() {
            // Dữ liệu giả (Mock Data)
            const mockData = {
                recall_id: 105,
                acknowledged_count: 35,
                total_expected: 50
            };

            // Cập nhật text trên màn hình
            document.getElementById('display_id').innerText = mockData.recall_id;
            document.getElementById('ack_count').innerText = mockData.acknowledged_count;
            document.getElementById('total_expected').innerText = mockData.total_expected;

            // Tính toán phần trăm tiến độ
            let percent = Math.round((mockData.acknowledged_count / mockData.total_expected) * 100);

            // Cập nhật độ dài của thanh tiến trình
            let progressBar = document.getElementById('my_progress_bar');
            progressBar.style.width = percent + "%";
            progressBar.innerText = percent + "%";
        }
    </script>

</body>

</html>
