<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRI TRACEABILITY - Đăng nhập hệ thống chuỗi lạnh</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background-color: var(--color-bg);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Brand Header */
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      text-align: center;
    }

    .auth-brand-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(36, 138, 61, 0.28);
    }

    .auth-brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--color-text-main);
      line-height: 1.1;
    }

    .auth-brand-subtitle {
      font-size: 13px;
      color: var(--color-text-muted);
      font-weight: 400;
    }

    /* Liquid Glass Card (Layer 3 Floating Window) */
    .auth-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 48px -12px rgba(0, 0, 0, 0.08), inset 0 1px 1px #ffffff;
      padding: 36px 32px;
    }

    .auth-heading {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--color-text-main);
      margin-bottom: 6px;
      text-align: center;
    }

    .auth-subheading {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-bottom: 24px;
      text-align: center;
    }

    .field-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-text-main);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #ffffff;
      color: var(--color-text-main);
      font-size: 14px;
      transition: var(--transition-fast);
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.02);
    }

    .form-control:hover {
      border-color: rgba(0, 0, 0, 0.2);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(36, 138, 61, 0.18);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: var(--radius-xs);
      transition: var(--transition-fast);
    }

    .toggle-pwd-btn:hover {
      color: var(--color-text-main);
    }

    .btn-submit {
      width: 100%;
      height: 42px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 8px;
    }

    #message {
      margin-top: 14px;
      min-height: 20px;
      font-size: 12.5px;
      font-weight: 500;
      text-align: center;
      transition: var(--transition-fast);
    }

    /* Demo Accounts Popover / Disclosure */
    .demo-disclosure {
      width: 100%;
      margin-top: 20px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
      transition: var(--transition-fast);
    }

    .demo-disclosure[open] {
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    .demo-summary {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      list-style: none;
    }

    .demo-summary::-webkit-details-marker {
      display: none;
    }

    .demo-summary:hover {
      color: var(--color-text-main);
      background: rgba(0, 0, 0, 0.02);
    }

    .demo-summary-content {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .demo-chevron {
      transition: transform 0.2s ease;
      color: var(--color-text-light);
    }

    .demo-disclosure[open] .demo-chevron {
      transform: rotate(180deg);
    }

    .demo-chips {
      padding: 6px 10px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 240px;
      overflow-y: auto;
      border-top: 1px solid var(--color-border-subtle);
    }

    .demo-chip-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--color-bg);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: left;
      transition: var(--transition-fast);
    }

    .demo-chip-btn:hover {
      background: rgba(36, 138, 61, 0.06);
      border-color: rgba(36, 138, 61, 0.2);
    }

    .demo-chip-info {
      display: flex;
      flex-direction: column;
    }

    .demo-chip-email {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-main);
    }

    .demo-chip-role {
      font-size: 11px;
      color: var(--color-text-muted);
    }

    .demo-chip-action {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-primary);
    }

    .auth-footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--color-text-light);
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <!-- Apple Minimalist Brand Header -->
    <div class="auth-brand">
      <div class="auth-brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12c0-2.2.7-4.2 1.9-5.9"/>
          <path d="M12 6v6l4 2"/>
          <path d="m4.93 4.93 4.24 4.24"/>
        </svg>
      </div>
      <div>
        <h1 class="auth-brand-title">AGRI TRACE</h1>
        <p class="auth-brand-subtitle">Chuỗi lạnh nông sản chuẩn VietGAP</p>
      </div>
    </div>

    <!-- Centered Liquid Glass Login Card -->
    <main class="auth-card">
      <h2 class="auth-heading">Đăng nhập</h2>
      <p class="auth-subheading">Nhập thông tin tài khoản để truy cập hệ thống</p>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="email" class="form-label">Email tài khoản</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="name@example.com"
              value="user@example.com"
              required
              autocomplete="email"
            >
          </div>
        </div>

        <div class="field-group">
          <label for="password" class="form-label">Mật khẩu</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="••••••••••••"
              value="Password@123"
              required
              autocomplete="current-password"
            >
            <button type="button" id="togglePasswordBtn" class="toggle-pwd-btn" title="Hiện/ẩn mật khẩu">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary btn-submit">
          Đăng nhập
        </button>

        <div id="message" role="alert" aria-live="polite"></div>
      </form>

      <!-- 1-Click Demo Accounts Disclosure -->
      <details class="demo-disclosure" id="demoDetails">
        <summary class="demo-summary">
          <span class="demo-summary-content">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            Tài khoản kiểm thử nhanh (7 vai trò)
          </span>
          <svg class="demo-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <div class="demo-chips">
          <button type="button" class="demo-chip-btn" onclick="fillCredentials('admin@example.com', 'Password@123')">
            <div class="demo-chip-info">
              <span class="demo-chip-email">admin@example.com</span>
              <span class="demo-chip-role">Quản trị viên (org-system) • Toàn quyền hệ thống</span>
            </div>
            <span class="demo-chip-action">Điền &rarr;</span>
          </button>
          <button type="button" class="demo-chip-btn" onclick="fillCredentials('orgadmin@example.com', 'Password@123')">
            <div class="demo-chip-info">
              <span class="demo-chip-email">orgadmin@example.com</span>
              <span class="demo-chip-role">Quản trị tổ chức (org-001) • Quản lý tổ chức</span>
            </div>
            <span class="demo-chip-action">Điền &rarr;</span>
          </button>
          <button type="button" class="demo-chip-btn" onclick="fillCredentials('user@example.com', 'Password@123')">
            <div class="demo-chip-info">
              <span class="demo-chip-email">user@example.com</span>
              <span class="demo-chip-role">Nông dân (org-001) • Khai báo thửa & thu hoạch</span>
            </div>
            <span class="demo-chip-action">Điền &rarr;</span>
          </button>
          <button type="button" class="demo-chip-btn" onclick="fillCredentials('user2@example.com', 'Password@123')">
            <div class="demo-chip-info">
              <span class="demo-chip-email">user2@example.com</span>
              <span class="demo-chip-role">Hợp tác xã (org-002) • Quản lý lô & thu hoạch</span>
            </div>
            <span class="demo-chip-action">Điền &rarr;</span>
          </button>
          <button type="button" class="demo-chip-btn" onclick="fillCredentials('transporter@example.com', 'Password@123')">
            <div class="demo-chip-info">
              <span class="demo-chip-email">transporter@example.com</span>
              <span class="demo-chip-role">Vận chuyển (org-trans) • Giám sát chuỗi lạnh</span>
            </div>
            <span class="demo-chip-action">Điền &rarr;</span>
          </button>
          <button type="button" class="demo-chip-btn" onclick="fillCredentials('distributor@example.com', 'Password@123')">
            <div class="demo-chip-info">
              <span class="demo-chip-email">distributor@example.com</span>
              <span class="demo-chip-role">Phân phối (org-dist) • Theo dõi phân phối</span>
            </div>
            <span class="demo-chip-action">Điền &rarr;</span>
          </button>
          <button type="button" class="demo-chip-btn" onclick="fillCredentials('inspector@example.com', 'Password@123')">
            <div class="demo-chip-info">
              <span class="demo-chip-email">inspector@example.com</span>
              <span class="demo-chip-role">Thanh tra (org-inspector) • Thanh tra chuỗi (Chỉ đọc)</span>
            </div>
            <span class="demo-chip-action">Điền &rarr;</span>
          </button>
        </div>
      </details>
    </main>

    <footer class="auth-footer">
      © 2026 TTCS K18 N2 • Nền tảng truy xuất nguồn gốc chuỗi lạnh
    </footer>
  </div>

  <script>
    function fillCredentials(email, pwd) {
      document.getElementById("email").value = email;
      document.getElementById("password").value = pwd;
      document.getElementById("message").textContent = "";
      document.getElementById("message").className = "";
      document.getElementById("email").focus();
    }

    const toggleBtn = document.getElementById("togglePasswordBtn");
    const pwdInput = document.getElementById("password");
    toggleBtn.addEventListener("click", () => {
      const isPwd = pwdInput.type === "password";
      pwdInput.type = isPwd ? "text" : "password";
      toggleBtn.innerHTML = isPwd
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
    });

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");

      if (!email || !password) {
        message.style.color = "var(--color-danger)";
        message.textContent = "Vui lòng nhập đầy đủ email và mật khẩu.";
        return;
      }

      message.style.color = "var(--color-text-muted)";
      message.textContent = "Đang xác thực thông tin...";
      submitBtn.disabled = true;

      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get("returnTo") || "/lots";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, returnTo })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.user) {
            try {
              sessionStorage.setItem(
                "agriUser",
                JSON.stringify({
                  id: data.user.id || data.user.userId,
                  email: data.user.email,
                  organizationId: data.user.organizationId,
                  roleId: data.user.roleId,
                })
              );
            } catch (err) {
              console.warn("Could not cache user", err);
            }
          }
          message.style.color = "var(--color-primary)";
          message.textContent = "Đăng nhập thành công! Đang chuyển hướng...";
          setTimeout(() => {
            window.location.href = data.redirectTo || "/lots";
          }, 300);
        } else if (response.status === 423) {
          message.style.color = "var(--color-danger)";
          message.textContent = data.message + ` Vui lòng thử lại sau ${data.retryAfterSeconds || 900} giây.`;
          submitBtn.disabled = false;
        } else {
          message.style.color = "var(--color-danger)";
          message.textContent = data.message || "Email hoặc mật khẩu không chính xác.";
          submitBtn.disabled = false;
        }
      } catch (error) {
        message.style.color = "var(--color-danger)";
        message.textContent = "Không thể kết nối máy chủ backend.";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
