<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRI TRACEABILITY - Quản lý lô thu hoạch & chuỗi lạnh</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* Search & Filter Toolbar - Liquid Glass */
    .filter-toolbar {
      background: var(--liquid-glass-bg);
      backdrop-filter: var(--liquid-glass-blur);
      -webkit-backdrop-filter: var(--liquid-glass-blur);
      border: var(--liquid-glass-border);
      border-radius: var(--radius-xl);
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: var(--liquid-glass-shadow);
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-light);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 14px 0 38px;
      border: 1px solid rgba(203, 213, 225, 0.85);
      border-radius: var(--radius-md);
      font-size: 13px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      color: var(--color-text-main);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
      transition: var(--transition-fast);
    }

    .search-input:focus {
      background: #ffffff;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.16);
    }

    .filter-pills {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(226, 232, 240, 0.85);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .filter-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background: rgba(255, 255, 255, 0.95);
    }

    .filter-btn.active {
      background: rgba(220, 252, 231, 0.9);
      color: var(--color-primary-active);
      border-color: rgba(187, 247, 208, 0.95);
      box-shadow: 0 2px 6px rgba(21, 128, 61, 0.1), inset 0 1px 1px #fff;
    }

    /* Lots Grid & Card - Liquid Glass Panels */
    .lots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .lot-card {
      background: var(--liquid-glass-bg);
      backdrop-filter: var(--liquid-glass-blur);
      -webkit-backdrop-filter: var(--liquid-glass-blur);
      border: var(--liquid-glass-border);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--liquid-glass-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: var(--transition-normal);
      position: relative;
    }

    .lot-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--liquid-glass-shadow-hover);
      border-color: rgba(187, 247, 208, 0.95);
    }

    .lot-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .lot-code-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--color-primary-active);
      background: rgba(220, 252, 231, 0.85);
      border: 1px solid rgba(187, 247, 208, 0.9);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      box-shadow: inset 0 1px 1px #ffffff;
    }


    .lot-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-main);
      margin-top: 8px;
      line-height: 1.3;
    }

    .lot-quantity-sub {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-primary);
      margin-top: 3px;
    }

    .lot-meta-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 0;
      border-top: 1px dashed var(--color-border);
      border-bottom: 1px dashed var(--color-border);
    }

    .lot-meta-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .lot-meta-label {
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lot-meta-value {
      font-weight: 600;
      color: var(--color-text-main);
    }

    .lot-card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-lot-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-primary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      transition: var(--transition-fast);
    }

    .btn-lot-action:hover {
      color: var(--color-primary-active);
      text-decoration: underline;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 56px 24px;
      background: var(--color-surface);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-lg);
      grid-column: 1 / -1;
    }

    .empty-state-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-full);
      background: var(--color-bg);
      color: var(--color-text-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .empty-state-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-main);
      margin-bottom: 6px;
    }

    .empty-state-desc {
      font-size: 13px;
      color: var(--color-text-muted);
      max-width: 380px;
      margin: 0 auto 20px auto;
    }

    @media (max-width: 640px) {
      .lots-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <!-- Global App Header with Navbar -->
  <header class="app-header">
    <div class="header-container">
      <a href="/lots" class="brand-link">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12c0-2.2.7-4.2 1.9-5.9"/>
            <path d="M12 6v6l4 2"/>
            <path d="m4.93 4.93 4.24 4.24"/>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-title">AGRI TRACE</span>
          <span class="brand-tag">Chuỗi lạnh nông sản</span>
        </div>
      </a>

      <!-- Navigation Tabs (S-01, S-06, S-07, S-08 connected!) -->
      <nav class="nav-links" aria-label="Điều hướng chính">
        <a href="/lots.html" class="nav-item active" id="navLots" aria-current="page">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          <span>Lô hàng</span>
        </a>
        <a href="/farms.html" class="nav-item" id="navFarms">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/><path d="M4 11V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7"/><path d="M14 15v5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-5"/><path d="M17 11V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-3"/><path d="M3 21h18"/></svg>
          <span>Thửa đất</span>
        </a>
        <a href="/products.html" class="nav-item" id="navProducts">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m10 15 5-3-5-3v6Z"/></svg>
          <span>Sản phẩm</span>
        </a>
        <a href="/harvest.html" class="nav-item" id="navHarvest">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span>Ghi nhận thu hoạch</span>
        </a>
      </nav>

      <div class="user-controls">
        <div class="user-pill" id="userPill">
          <div class="user-avatar" id="userAvatar"><span class="skeleton-shimmer skeleton-avatar"></span></div>
          <div class="user-meta">
            <span class="user-email" id="userEmail"><span class="skeleton-shimmer skeleton-text"></span></span>
            <div class="user-badges">
              <span class="badge-org" id="userOrg"><span class="skeleton-shimmer skeleton-badge"></span></span>
              <span class="badge-role" id="userRole"><span class="skeleton-shimmer skeleton-badge"></span></span>
            </div>
          </div>
        </div>
        <!-- Retain id="userInfo" for backward compatibility -->
        <span id="userInfo" style="display: none;"></span>

        <button id="logout" class="btn-logout" title="Đăng xuất khỏi phiên làm việc">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Đăng xuất</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="main-wrapper">
    <!-- Page Header & Action -->
    <div class="page-header">
      <div class="page-title-group">
        <h1>Danh sách lô thu hoạch</h1>
        <p class="page-subtitle">Giám sát danh sách lô thu hoạch theo phân quyền tổ chức</p>
      </div>
      <div class="page-actions">
        <a href="/harvest.html" class="btn-primary" id="btnGoHarvest">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Ghi nhận thu hoạch</span>
        </a>
        <a href="/farms.html" class="btn-secondary" style="border: 1px solid var(--color-border);">
          <span>Khai báo thửa đất</span>
        </a>
      </div>
    </div>

    <!-- Overview Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon green">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
        </div>
        <div>
          <div class="stat-value" id="statTotalLots">0</div>
          <div class="stat-label">Tổng số lô thu hoạch</div>
        </div>
      </div>
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="filter-toolbar">
      <div class="search-box">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Tìm theo tên sản phẩm hoặc mã lô (vd: LOT-001)..."
        >
      </div>
    </div>

    <!-- Lots Container -->
    <div id="lots" class="lots-grid" aria-live="polite">
      <!-- Dynamic lots inserted here -->
    </div>
  </main>

  <script src="/app-shell.js"></script>
  <script>
    let allLots = [];
    let searchQuery = "";

    async function loadPage() {
      const lotsContainer = document.getElementById("lots");
      lotsContainer.innerHTML = "<div style='grid-column: 1/-1; text-align: center; padding: 40px; color: var(--color-text-muted);'>Đang tải dữ liệu lô thu hoạch...</div>";

      try {
        // 1. Khởi tạo App Shell (hiển thị tức thì từ sessionStorage + revalidate nền)
        const user = await initAppShell({ activeNav: "lots" });
        if (!user) return;

        const writableHarvestRoles = ["producer", "cooperative", "org_admin", "admin"];
        const harvestButton = document.getElementById("btnGoHarvest");
        if (harvestButton && !writableHarvestRoles.includes(user.roleId)) {
          harvestButton.removeAttribute("href");
          harvestButton.setAttribute("aria-disabled", "true");
          harvestButton.setAttribute("title", "Vai trò hiện tại không có quyền ghi nhận thu hoạch");
          harvestButton.style.opacity = "0.55";
          harvestButton.style.cursor = "not-allowed";
        }

        // Backward compatibility
        const userInfoEl = document.getElementById("userInfo");
        if (userInfoEl) userInfoEl.textContent = `Email: ${user.email} | Tổ chức: ${user.organizationId}`;

        // 2. Tải danh sách lô của tổ chức
        const lotsResponse = await fetch("/api/organization/lots");
        if (!lotsResponse.ok) {
          lotsContainer.innerHTML = "<div class='empty-state'><div class='empty-state-title'>Không thể tải danh sách lô</div><div class='empty-state-desc'>Vui lòng thử lại sau hoặc liên hệ quản trị viên.</div></div>";
          return;
        }

        const lotsData = await lotsResponse.json();
        allLots = lotsData.lots || [];

        updateStats(allLots);
        renderLots();
      } catch (error) {
        lotsContainer.innerHTML = "<div class='empty-state'><div class='empty-state-title'>Lỗi kết nối máy chủ</div><div class='empty-state-desc'>Không thể đồng bộ dữ liệu với máy chủ backend.</div></div>";
      }
    }

    function updateStats(lots) {
      document.getElementById("statTotalLots").textContent = lots.length;
    }

    function formatDate(dateVal) {
      if (!dateVal) return "N/A";
      if (typeof dateVal === "string" && dateVal.includes("T")) {
        dateVal = dateVal.split("T")[0];
      }
      const parts = String(dateVal).split("-");
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return String(dateVal);
    }

    function renderLots() {
      const lotsContainer = document.getElementById("lots");
      lotsContainer.innerHTML = "";

      let filtered = allLots.filter(lot => {
        const q = searchQuery.toLowerCase();
        return (
          (lot.id || "").toLowerCase().includes(q) ||
          (lot.name || "").toLowerCase().includes(q) ||
          (lot.productName || "").toLowerCase().includes(q) ||
          (lot.farmName || "").toLowerCase().includes(q)
        );
      });

      if (filtered.length === 0) {
        lotsContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <div class="empty-state-title">Không tìm thấy lô hàng phù hợp</div>
            <div class="empty-state-desc">Hãy thử thay đổi từ khóa tìm kiếm.</div>
            <button class="btn-secondary" onclick="resetFilters()">Đặt lại tìm kiếm</button>
          </div>
        `;
        return;
      }

      filtered.forEach(lot => {
        const card = document.createElement("div");
        card.className = "lot-card";

        const unit = lot.productUnit || "kg";
        const initialQtyFormatted = (lot.initialQuantity !== null && lot.initialQuantity !== undefined)
          ? `${Number(lot.initialQuantity).toFixed(3)} ${unit}`
          : "";
        const remainingQtyFormatted = (lot.remainingQuantity !== null && lot.remainingQuantity !== undefined)
          ? `${Number(lot.remainingQuantity).toFixed(3)} ${unit}`
          : "N/A";
        const harvestDateFormatted = formatDate(lot.harvestedAt || lot.createdAt);
        const displayName = lot.productName || lot.name || "Nông sản";
        const farmDisplay = lot.farmName || lot.farmId || "Thửa chưa gán";

        card.innerHTML = `
          <div>
            <div class="lot-card-top">
              <span class="lot-code-tag">${lot.id}</span>
              <span class="status-pill success">
                <span class="status-dot"></span>
                <span>${lot.status || "Đã thu hoạch"}</span>
              </span>
            </div>
            <h3 class="lot-title">${displayName}</h3>
            ${initialQtyFormatted ? `<div class="lot-quantity-sub">${initialQtyFormatted}</div>` : ""}
          </div>

          <div class="lot-meta-list">
            <div class="lot-meta-item">
              <span class="lot-meta-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Thu hoạch:
              </span>
              <span class="lot-meta-value">${harvestDateFormatted}</span>
            </div>
            <div class="lot-meta-item">
              <span class="lot-meta-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Thửa:
              </span>
              <span class="lot-meta-value">${farmDisplay}</span>
            </div>
            <div class="lot-meta-item">
              <span class="lot-meta-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                Còn lại:
              </span>
              <span class="lot-meta-value" style="color: var(--color-primary); font-weight: 700;">
                ${remainingQtyFormatted}
              </span>
            </div>
          </div>

          <div class="lot-card-actions">
            <button type="button" class="btn-lot-action" onclick="alert('Chi tiết lô: ${lot.id}\\nSản phẩm: ${displayName}\\nKhối lượng ban đầu: ${initialQtyFormatted || \"--\"}\\nCòn lại: ${remainingQtyFormatted}\\nThửa đất: ${farmDisplay}\\nNgày thu hoạch: ${harvestDateFormatted}')">
              <span>[Chi tiết] &rarr;</span>
            </button>
            <span style="font-size: 11px; color: var(--color-text-light);">${lot.organizationId || ""}</span>
          </div>
        `;
        lotsContainer.appendChild(card);
      });
    }

    function resetFilters() {
      document.getElementById("searchInput").value = "";
      searchQuery = "";
      renderLots();
    }

    // Search input listener
    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderLots();
    });

    loadPage();
  </script>
</body>
</html>
