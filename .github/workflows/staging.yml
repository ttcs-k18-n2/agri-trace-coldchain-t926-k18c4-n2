name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER || env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy-staging:
    name: Deploy to Staging & Health Check
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remote Deploy via SSH (when STAGING_SSH_HOST configured)
        if: "${{ secrets.STAGING_SSH_HOST != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.STAGING_DEPLOY_PATH || '/opt/agri-trace-coldchain' }}"
            cd "$DEPLOY_PATH"
            echo "Pulling latest code on staging host..."
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            chmod +x deploy/staging-deploy.sh
            ./deploy/staging-deploy.sh "${{ github.sha }}"

      - name: Runner Staging Deployment & Rollback Verification (when SSH not configured)
        if: "${{ secrets.STAGING_SSH_HOST == '' }}"
        run: |
          echo "STAGING_SSH_HOST chua duoc cau hinh trong GitHub Secrets."
          echo "Thuc hien kiem tra quy trinh deploy staging (migration -> startup -> healthcheck -> rollback) truc tiep tren runner..."
          cp .env.example .env
          chmod +x deploy/staging-deploy.sh
          ./deploy/staging-deploy.sh "${{ github.sha }}"
