name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER || env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy-staging:
    name: Deploy to Staging & Health Check
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to real Staging server
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          STAGING_SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET || secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail

          for required in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_KEY STAGING_DEPLOY_PATH; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing required GitHub Secret: $required"
              exit 1
            fi
          done

          SSH_PORT="${STAGING_SSH_PORT:-22}"
          DEPLOY_PATH="${STAGING_DEPLOY_PATH:-/opt/agri-trace-coldchain}"

          mkdir -p ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_id_ed25519
          chmod 600 ~/.ssh/staging_id_ed25519

          ssh-keyscan -p "$SSH_PORT" "$STAGING_SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          REMOTE_DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH")

          echo "Deploying commit ${{ github.sha }} to $STAGING_SSH_HOST:$DEPLOY_PATH"

          ssh -p "$SSH_PORT" -i ~/.ssh/staging_id_ed25519             "$STAGING_SSH_USER@$STAGING_SSH_HOST" "
              set -euo pipefail
              cd $REMOTE_DEPLOY_PATH
              git fetch origin main
              git checkout -B main origin/main
              chmod +x deploy/staging-deploy.sh
              ./deploy/staging-deploy.sh '${{ github.sha }}' '${STAGING_SESSION_SECRET:-}'
            "
