name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER || env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy-staging:
    name: Deploy to Staging & Health Check
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging Server with Health Check and Rollback
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          if [ -n "$STAGING_SSH_HOST" ]; then
            echo "STAGING_SSH_HOST duoc cau hinh. Thuc hien deploy tu xa qua SSH toi $STAGING_SSH_HOST..."
            mkdir -p ~/.ssh
            echo "$STAGING_SSH_KEY" > ~/.ssh/staging_id_rsa
            chmod 600 ~/.ssh/staging_id_rsa
            SSH_PORT="${STAGING_SSH_PORT:-22}"
            DEPLOY_PATH="${STAGING_DEPLOY_PATH:-/opt/agri-trace-coldchain}"
            ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" -i ~/.ssh/staging_id_rsa "$STAGING_SSH_USER@$STAGING_SSH_HOST" "
              set -e
              cd $DEPLOY_PATH
              git fetch origin main
              git checkout main
              git pull --ff-only origin main
              chmod +x deploy/staging-deploy.sh
              ./deploy/staging-deploy.sh ${{ github.sha }}
            "
          else
            echo "STAGING_SSH_HOST chua duoc cau hinh trong GitHub Secrets."
            echo "Thuc hien kiem tra quy trinh deploy staging (migration -> startup -> healthcheck -> rollback) truc tiep tren runner..."
            cp .env.example .env
            chmod +x deploy/staging-deploy.sh
            ./deploy/staging-deploy.sh "${{ github.sha }}"
          fi
