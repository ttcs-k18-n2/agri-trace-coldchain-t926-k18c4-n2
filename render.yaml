services:
  - type: web
    name: agri-trace-coldchain
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: auto
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_FAILED_ATTEMPTS
        value: "5"
      - key: LOCK_MINUTES
        value: "15"
      - key: DATABASE_URL
        fromDatabase:
          name: agri-trace-db
          property: connectionString

databases:
  - name: agri-trace-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: agri_trace
    user: agri_user
    ipAllowList: []
